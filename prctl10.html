<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-3xl mx-auto">

        <header class="bg-gradient-to-r from-teal-900 via-gray-900 to-teal-900 text-white p-6 rounded-xl text-center mb-6">
            <h1 class="text-3xl font-bold">Student Attendance Tracker</h1>
            <p class="mt-2">Digital Classroom Attendance Manager</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow mb-6">
            <h2 class="text-xl font-bold text-teal-700 mb-4">
                Add Student
            </h2>

            <form id="studentForm" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="name"
                    placeholder="Enter student name"
                    class="flex-1 border p-3 rounded-lg" required>

                <input type="text" id="usn"
                    placeholder="Enter USN"
                    class="flex-1 border p-3 rounded-lg" required>

                <button type="submit"
                    class="bg-teal-700 text-white px-5 py-3 rounded-lg">
                    Add Student
                </button>
            </form>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow text-center">
                <p>Total Students</p>
                <h2 id="total" class="text-2xl font-bold text-teal-700">0</h2>
            </div>

            <div class="bg-white p-4 rounded-xl shadow text-center">
                <p>Present</p>
                <h2 id="present" class="text-2xl font-bold text-green-600">0</h2>
            </div>

            <div class="bg-white p-4 rounded-xl shadow text-center">
                <p>Absent</p>
                <h2 id="absent" class="text-2xl font-bold text-red-600">0</h2>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow">
            <h2 class="text-xl font-bold text-teal-700 mb-4">
                Attendance List
            </h2>

            <div id="studentList" class="space-y-3"></div>
            <p id="empty" class="text-center text-gray-500">
                No students added yet.
            </p>
        </div>

    </div>

    <script>
        let students = [];

        document.getElementById("studentForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let usn = document.getElementById("usn").value.trim();

            if (students.some(function(student) {
                return student.usn.toLowerCase() === usn.toLowerCase();
            })) {
                alert("This USN already exists!");
                return;
            }

            students.push({
                name: name,
                usn: usn,
                status: "Not Marked"
            });

            this.reset();
            displayStudents();
        });

        function displayStudents() {
            let list = document.getElementById("studentList");
            list.innerHTML = "";

            students.forEach(function(student, index) {
                let card = document.createElement("div");
                card.className = "border p-4 rounded-lg flex flex-col sm:flex-row justify-between gap-3";

                let details = document.createElement("div");

                let nameText = document.createElement("p");
                nameText.className = "font-bold text-lg";
                nameText.textContent = student.name;

                let usnText = document.createElement("p");
                usnText.className = "text-gray-500";
                usnText.textContent = "USN: " + student.usn;

                let statusText = document.createElement("p");
                statusText.className = "font-semibold";
                statusText.textContent = "Status: " + student.status;

                details.appendChild(nameText);
                details.appendChild(usnText);
                details.appendChild(statusText);

                let buttons = document.createElement("div");
                buttons.className = "flex flex-wrap gap-2";

                ["Present", "Absent"].forEach(function(status) {
                    let button = document.createElement("button");
                    button.textContent = status;
                    button.className = status === "Present"
                        ? "bg-green-600 text-white px-3 py-2 rounded"
                        : "bg-red-600 text-white px-3 py-2 rounded";

                    button.onclick = function() {
                        students[index].status = status;
                        displayStudents();
                    };

                    buttons.appendChild(button);
                });

                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "bg-gray-600 text-white px-3 py-2 rounded";

                deleteButton.onclick = function() {
                    students.splice(index, 1);
                    displayStudents();
                };

                buttons.appendChild(deleteButton);
                card.appendChild(details);
                card.appendChild(buttons);
                list.appendChild(card);
            });

            document.getElementById("total").textContent = students.length;

            document.getElementById("present").textContent =
                students.filter(function(s) {
                    return s.status === "Present";
                }).length;

            document.getElementById("absent").textContent =
                students.filter(function(s) {
                    return s.status === "Absent";
                }).length;

            document.getElementById("empty").style.display =
                students.length === 0 ? "block" : "none";
        }
    </script>

</body>
</html>
